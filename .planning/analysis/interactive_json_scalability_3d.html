<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Premium 3D JSON Scalability Architecture</title>
  <!-- Apache ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0b0f19;
      /* Deep premium dark mode */
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #main {
      width: 100vw;
      height: 100vh;
    }

    .header {
      position: absolute;
      top: 20px;
      left: 30px;
      z-index: 10;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 1px;
      font-weight: 600;
      color: #58a6ff;
    }

    p {
      margin: 5px 0 0 0;
      color: #8b949e;
      font-size: 14px;
      max-width: 400px;
      line-height: 1.4;
    }

    /* Glassmorphism Controls Overlay */
    .controls {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 20;
      background: rgba(13, 17, 23, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .controls h3 {
      margin: 0 0 20px 0;
      font-size: 14px;
      color: #c9d1d9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .controls h3 span {
      font-size: 15px;
      background: rgba(255, 76, 76, 0.15);
      color: #ff4c4c;
      padding: 4px 10px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
      text-transform: none;
      letter-spacing: normal;
      font-weight: bold;
    }

    .control-group {
      margin-bottom: 20px;
    }

    .control-group:last-child {
      margin-bottom: 0px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-group label strong {
      color: #fff;
      font-size: 15px;
    }

    select.profile-dropdown {
      width: 100%;
      background: #0d1117;
      color: #c9d1d9;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      appearance: none;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    
    select.profile-dropdown:hover, select.profile-dropdown:focus {
      border-color: #58a6ff;
    }

    #equationDisplay {
      margin-top: 8px;
      font-size: 12px;
      color: #58a6ff;
      font-weight: 600;
      background: rgba(88, 166, 255, 0.1);
      padding: 6px 10px;
      border-radius: 4px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    /* Specific header decoupling */
    .section-split {
      margin-top: 25px;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Premium Slider Base */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      background: transparent;
      cursor: pointer;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      background: #30363d;
      border-radius: 4px;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #58a6ff;
      margin-top: -6px;
      box-shadow: 0 0 10px rgba(88, 166, 255, 0.5);
      transition: transform 0.1s;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Scale Slider Color Shift */
    .scale-slider::-webkit-slider-thumb {
      background: #a371f7 !important;
      box-shadow: 0 0 10px rgba(163, 113, 247, 0.5) !important;
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>Architecture Payload Scalability</h1>
    <p>A high-performance WebGL surface mapping the JSON file bloat projections between different design systems.</p>
  </div>

  <!-- Custom UI Panel -->
  <div class="controls">
    
    <div class="control-group">
      <label><span>Architecture Profile</span></label>
      <select id="profileSelect" class="profile-dropdown">
        <option value="heavy">Heavy Diagram (Multiplicative)</option>
        <option value="light">Light DSA Component (Linear)</option>
        <option value="optimized">Topology-Split (Optimized Delta)</option>
        <option value="compare">Compare: Heavy vs Optimized</option>
        <option value="custom">Custom Equation (Dynamic)</option>
      </select>
      <div id="equationDisplay">Eq: Z = 5 + 2V + 0.5(S*V)</div>
      
      <div id="customEquationGroup" style="display: none; margin-top: 15px;">
          <label><span>Custom Math Formula</span></label>
          <div id="customInputWrapper" style="display: flex; align-items: center; background: #0d1117; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; transition: border-color 0.2s;">
              <div style="padding: 8px 0 8px 12px; color: #58a6ff; font-weight: bold; font-family: monospace;">Z = </div>
              <input type="text" id="customEquationInput" value="0.5 * s * Math.pow(v, 1.2)" style="width:100%; box-sizing:border-box; background:transparent; color:#f2c94c; border:none; padding: 8px 12px 8px 6px; font-family: monospace; outline: none;">
          </div>
          <div style="font-size: 10px; color: #8b949e; margin-top: 5px;">Use 's' for steps, 'v' for visuals. Standard JS Math available.</div>
      </div>
    </div>

    <h3 class="section-split">Live Tracker
      <span id="sizeValue">37.5 KB</span>
    </h3>

    <div class="control-group">
      <label><span>Steps</span> <strong id="stepValue">9</strong></label>
      <input type="range" id="stepSlider" min="0" max="100" value="9" step="1">
    </div>

    <div class="control-group">
      <label><span>Visual Elements</span> <strong id="visualValue">5</strong></label>
      <input type="range" id="visualSlider" min="0" max="30" value="5" step="1">
    </div>

    <h3 class="section-split">Axis Scale Limits</h3>

    <div class="control-group">
      <label><span>Max Axis Steps</span> <strong id="maxStepValue">100</strong></label>
      <input type="range" id="maxStepSlider" class="scale-slider" min="10" max="500" value="100" step="10">
    </div>

    <div class="control-group">
      <label><span>Max Axis Visuals</span> <strong id="maxVisualValue">30</strong></label>
      <input type="range" id="maxVisualSlider" class="scale-slider" min="5" max="100" value="30" step="5">
    </div>
  </div>

  <div id="main"></div>

  <script>
    var chartDom = document.getElementById('main');
    var myChart = echarts.init(chartDom);

    var currentProfile = 'heavy';

    // Core Formula Logic Router
    function calculateJSONSize(steps, visuals) {
      if (currentProfile === 'heavy') {
         // Heavy Multiplicative Bloat
         return 5 + (2 * visuals) + (0.5 * steps * visuals);
      } else if (currentProfile === 'light') {
         // Light Linear Pipeline
         return 0.25 + (0.75 * steps) + (3.10 * visuals);
      } else if (currentProfile === 'optimized') {
         // Optimized Topology-Split Delta (94% per-step reduction)
         return 5 + (2.5 * visuals) + (0.03 * steps * visuals);
      } else {
         // Custom runtime mathematical evaluation
         try {
            const eqStr = document.getElementById('customEquationInput').value;
            const compute = new Function('s', 'v', 'return (' + eqStr + ');');
            const result = compute(steps, visuals);
            return isNaN(result) || result < 0 ? 0 : result;
         } catch(e) {
            return 0; // Temporary fallback while user types incomplete syntax
         }
      }
    }

    var currentSteps = 9;
    var currentVisuals = 5;
    var currentSize = calculateJSONSize(currentSteps, currentVisuals);

    function buildSeriesArray(steps, visuals, maxS, maxV) {
      if (currentProfile === 'compare') {
        let heavySize = 5 + (2 * visuals) + (0.5 * steps * visuals);
        let optSize = 5 + (2.5 * visuals) + (0.03 * steps * visuals);
        return [
          {
            type: 'surface', name: 'Heavy (Unoptimized)',
            wireframe: { show: true, lineStyle: { color: 'rgba(255, 76, 76, 0.2)'} }, shading: 'realistic',
            itemStyle: { color: '#ff4c4c', opacity: 0.4 },
            equation: { x: { step: 2, min: 0, max: maxS }, y: { step: 1, min: 0, max: maxV }, z: function (x, y) { return 5 + 2*y + 0.5*x*y; } }
          },
          {
            type: 'surface', name: 'Topology-Split (Optimized)',
            wireframe: { show: true, lineStyle: { color: 'rgba(66, 244, 98, 0.4)'} }, shading: 'realistic',
            itemStyle: { color: '#42f462', opacity: 0.8 },
            equation: { x: { step: 2, min: 0, max: maxS }, y: { step: 1, min: 0, max: maxV }, z: function (x, y) { return 5 + 2.5*y + 0.03*x*y; } }
          },
          {
            type: 'scatter3D', name: 'Live Tracker (Heavy)',
            data: [[steps, visuals, heavySize]], symbol: 'circle', symbolSize: 22,
            itemStyle: { color: '#ff4c4c', borderWidth: 2, borderColor: '#fff' }, label: { show: false }
          },
          {
            type: 'scatter3D', name: 'Live Tracker (Optimized)',
            data: [[steps, visuals, optSize]], symbol: 'circle', symbolSize: 22,
            itemStyle: { color: '#42f462', borderWidth: 2, borderColor: '#fff' }, label: { show: false }
          }
        ];
      } else {
        var size = calculateJSONSize(steps, visuals);
        return [
          {
            type: 'surface', name: 'Scalability Surface',
            wireframe: { show: false }, shading: 'realistic',
            realisticMaterial: { roughness: 0.4, metalness: 0.1 },
            itemStyle: { opacity: 0.95 },
            equation: { x: { step: 2, min: 0, max: maxS }, y: { step: 1, min: 0, max: maxV }, z: function (x, y) { return calculateJSONSize(x, y); } }
          },
          {
            type: 'surface', name: 'Hidden Surface',
            itemStyle: { opacity: 0 }, equation: { x: { step: 2, min: 0, max: maxS }, y: { step: 1, min: 0, max: maxV }, z: function() { return -100; } }
          },
          {
            type: 'scatter3D', name: 'Live Tracker',
            data: [[steps, visuals, size]], symbol: 'circle', symbolSize: 22,
            itemStyle: { color: '#ff2a2a', borderWidth: 3, borderColor: '#fff', shadowBlur: 20, shadowColor: 'rgba(255,0,0,1)' }, label: { show: false }
          },
          {
            type: 'scatter3D', name: 'Hidden Scatter', data: [], itemStyle: { opacity: 0 }
          }
        ];
      }
    }

    var maxStepsLimit = 100;
    var maxVisualsLimit = 30;

    var option = {
      tooltip: {
        formatter: function (params) {
          if (params.seriesName.includes('Live Tracker')) {
            return '<div style="background:#1f2937;padding:10px;border-radius:6px;border:1px solid #ff4c4c;">' +
              '<b style="color:#ff4c4c">' + params.seriesName + '</b><br/>' +
              'Steps: ' + params.value[0] + '<br/>' +
              'Visuals: ' + params.value[1] + '<br/>' +
              'Est Size: ' + params.value[2].toFixed(1) + ' KB</div>';
          }
          return 'Steps: ' + params.value[0] + '<br/>' +
            'Visuals: ' + params.value[1] + '<br/>' +
            'Size: ' + params.value[2].toFixed(1) + ' KB';
        },
        backgroundColor: 'rgba(0,0,0,0.8)',
        textStyle: { color: '#fff' },
        borderWidth: 0
      },
      visualMap: {
        show: true,
        seriesIndex: [0],
        dimension: 2,
        min: 0,
        max: calculateJSONSize(maxStepsLimit, maxVisualsLimit),
        calculable: true,
        right: 30,
        bottom: 30,
        inRange: {
          color: ['#00d2ff', '#3a7bd5', '#8a2387', '#e94057', '#f27121']
        },
        textStyle: { color: '#8b949e' },
        formatter: '{value} KB'
      },
      xAxis3D: {
        type: 'value', min: 0, max: maxStepsLimit, name: 'Number of steps', nameGap: 28,
        nameTextStyle: { color: '#ffffff', fontSize: 13, fontWeight: 'bold' },
        axisLabel: { textStyle: { color: '#8b949e' }, formatter: function (value) { return value === 0 ? '' : value; } },
        axisLine: { lineStyle: { color: '#30363d' } }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }
      },
      yAxis3D: {
        type: 'value', min: 0, max: maxVisualsLimit, name: 'Number of visual elements', nameGap: 28,
        nameTextStyle: { color: '#ffffff', fontSize: 13, fontWeight: 'bold' },
        axisLabel: { textStyle: { color: '#8b949e' }, formatter: function (value) { return value === 0 ? '' : value; } },
        axisLine: { lineStyle: { color: '#30363d' } }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }
      },
      zAxis3D: {
        type: 'value', min: 0, name: 'Scene JSON size (KB)', nameGap: 28,
        nameTextStyle: { color: '#ffffff', fontSize: 13, fontWeight: 'bold' },
        axisLabel: { textStyle: { color: '#8b949e' } },
        axisLine: { lineStyle: { color: '#30363d' } }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }
      },
      grid3D: {
        viewControl: { projection: 'perspective', alpha: 40, beta: 45, distance: 250 },
        boxDepth: 100, boxHeight: 80, boxWidth: 100, environment: 'auto',
        light: { main: { intensity: 1.5, shadow: true, shadowQuality: 'high', alpha: 30, beta: 40 }, ambient: { intensity: 0.4 } }
      },
      series: buildSeriesArray(currentSteps, currentVisuals, maxStepsLimit, maxVisualsLimit)
    };

    myChart.setOption(option);

    // --- Control Logic ---

    const profileSelect = document.getElementById('profileSelect');
    const equationDisplay = document.getElementById('equationDisplay');

    const uiStepValue = document.getElementById('stepValue');
    const uiVisualValue = document.getElementById('visualValue');
    const uiSizeValue = document.getElementById('sizeValue');
    const sliderStep = document.getElementById('stepSlider');
    const sliderVisual = document.getElementById('visualSlider');

    const uiMaxStepValue = document.getElementById('maxStepValue');
    const uiMaxVisualValue = document.getElementById('maxVisualValue');
    const sliderMaxStep = document.getElementById('maxStepSlider');
    const sliderMaxVisual = document.getElementById('maxVisualSlider');

    const customGroup = document.getElementById('customEquationGroup');
    const customInput = document.getElementById('customEquationInput');

    // Profile Switcher Event
    profileSelect.addEventListener('change', function(e) {
        currentProfile = e.target.value;
        if(currentProfile === 'heavy') {
            customGroup.style.display = "none";
            equationDisplay.style.display = "block";
            equationDisplay.innerText = "Eq: Z = 5 + 2V + 0.5(S*V)";
            equationDisplay.style.color = "#ff4c4c";
            equationDisplay.style.background = "rgba(255, 76, 76, 0.15)";
        } else if (currentProfile === 'light') {
            customGroup.style.display = "none";
            equationDisplay.style.display = "block";
            equationDisplay.innerText = "Eq: Z = 0.25 + 0.75S + 3.10V";
            equationDisplay.style.color = "#42f462";
            equationDisplay.style.background = "rgba(66, 244, 98, 0.15)";
        } else if (currentProfile === 'optimized') {
            customGroup.style.display = "none";
            equationDisplay.style.display = "block";
            equationDisplay.innerText = "Eq: Z = 5 + 2.5V + 0.03(S*V)";
            equationDisplay.style.color = "#a371f7";
            equationDisplay.style.background = "rgba(163, 113, 247, 0.15)";
        } else if (currentProfile === 'compare') {
            customGroup.style.display = "none";
            equationDisplay.style.display = "block";
            equationDisplay.innerText = "Compare: Heavy (Red) vs Optimized (Green)";
            equationDisplay.style.color = "#ffffff";
            equationDisplay.style.background = "linear-gradient(90deg, rgba(255,76,76,0.25) 0%, rgba(66,244,98,0.25) 100%)";
        } else if (currentProfile === 'custom') {
            customGroup.style.display = "block";
            equationDisplay.style.display = "none";
            
            // Custom Input Glow Logic (Optional Style Focus)
            customInput.focus();
        }
        
        // Force full re-eval of mathematical bounds
        updateAxisBounds(); 
    });

    customInput.addEventListener('input', function() {
        if(currentProfile === 'custom') {
            updateAxisBounds(); // Re-simulate physics immediately on keystroke
        }
    });

    // Custom Input stylistic focus wrapper
    const customInputWrapper = document.getElementById('customInputWrapper');
    customInput.addEventListener('focus', function() {
        customInputWrapper.style.borderColor = '#58a6ff';
    });
    customInput.addEventListener('blur', function() {
        customInputWrapper.style.borderColor = 'rgba(255,255,255,0.2)';
    });


    function updateScatterPoint() {
      myChart.setOption({
        series: buildSeriesArray(currentSteps, currentVisuals, maxStepsLimit, maxVisualsLimit)
      });

      if (currentProfile === 'compare') {
          var hSize = 5 + (2 * currentVisuals) + (0.5 * currentSteps * currentVisuals);
          var oSize = 5 + (2.5 * currentVisuals) + (0.03 * currentSteps * currentVisuals);
          uiStepValue.innerText = currentSteps;
          uiVisualValue.innerText = currentVisuals;
          uiSizeValue.innerHTML = `<span style="color:#ff4c4c">${hSize.toFixed(1)} KB</span> vs <span style="color:#42f462">${oSize.toFixed(1)} KB</span>`;
      } else {
          var newSize = calculateJSONSize(currentSteps, currentVisuals);
          uiStepValue.innerText = currentSteps;
          uiVisualValue.innerText = currentVisuals;
          uiSizeValue.innerText = newSize.toFixed(1) + " KB";
      }
    }

    function updateAxisBounds() {
      uiMaxStepValue.innerText = maxStepsLimit;
      uiMaxVisualValue.innerText = maxVisualsLimit;

      sliderStep.max = maxStepsLimit;
      sliderVisual.max = maxVisualsLimit;

      var theoreticalHighestJSONSize = currentProfile === 'compare' 
        ? (5 + (2 * maxVisualsLimit) + (0.5 * maxStepsLimit * maxVisualsLimit)) 
        : calculateJSONSize(maxStepsLimit, maxVisualsLimit);

      myChart.setOption({
        visualMap: {
          show: currentProfile !== 'compare',
          seriesIndex: currentProfile === 'compare' ? [] : [0],
          max: theoreticalHighestJSONSize
        },
        xAxis3D: { max: maxStepsLimit },
        yAxis3D: { max: maxVisualsLimit }
      });

      if (currentSteps > maxStepsLimit) {
        currentSteps = maxStepsLimit;
        sliderStep.value = currentSteps;
      }
      if (currentVisuals > maxVisualsLimit) {
        currentVisuals = maxVisualsLimit;
        sliderVisual.value = currentVisuals;
      }

      updateScatterPoint(); 
    }

    sliderStep.addEventListener('input', function (e) {
      currentSteps = parseFloat(e.target.value);
      updateScatterPoint();
    });
    sliderVisual.addEventListener('input', function (e) {
      currentVisuals = parseFloat(e.target.value);
      updateScatterPoint();
    });

    sliderMaxStep.addEventListener('input', function (e) {
      maxStepsLimit = parseFloat(e.target.value);
      updateAxisBounds();
    });
    sliderMaxVisual.addEventListener('input', function (e) {
      maxVisualsLimit = parseFloat(e.target.value);
      updateAxisBounds();
    });

    window.addEventListener('resize', function () {
      myChart.resize();
    });
  </script>
</body>

</html>
